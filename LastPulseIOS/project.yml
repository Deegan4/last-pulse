name: LastPulse
options:
  bundleIdPrefix: com.lastpulse
  deploymentTarget:
    iOS: "17.0"
targets:
  LastPulse:
    type: application
    platform: iOS
    sources:
      - path: LastPulse
      - path: GameContent
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lastpulse.game
        PRODUCT_NAME: LastPulse
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LastPulse/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: A6H72TGWNL
    scheme:
      testTargets: []
