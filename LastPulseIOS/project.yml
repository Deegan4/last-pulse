name: LastPulse
options:
  bundleIdPrefix: com.lastpulse
  deploymentTarget:
    iOS: "16.0"
targets:
  LastPulse:
    type: application
    platform: iOS
    sources:
      - path: LastPulse
    resources:
      - path: GameContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lastpulse.game
        PRODUCT_NAME: Last Pulse
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LastPulse/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
