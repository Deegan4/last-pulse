name: LastPulse
options:
  bundleIdPrefix: com.lastpulse
  deploymentTarget:
    iOS: "17.0"
targets:
  LastPulse:
    type: application
    platform: iOS
    sources:
      - path: LastPulse
    preBuildScripts:
      - name: Build Shared Game
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "$SRCROOT/../scripts/build-game.py" --ios-only --ios-output "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/GameContent"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lastpulse.game
        PRODUCT_NAME: LastPulse
        SWIFT_VERSION: 5.0
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: LastPulse/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: A6H72TGWNL
        CODE_SIGN_ENTITLEMENTS: LastPulse/LastPulse.entitlements
    scheme:
      testTargets: []
